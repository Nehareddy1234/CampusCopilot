name: lms-monitor

on:
  schedule:
    # Every 4 hours. Adjust to taste; VIT LMS is slow, so keep it conservative.
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run LMS monitor
        run: npm run build && node dist/monitor.js
        env:
          SCRAPER_SERVICE_URL: ${{ secrets.SCRAPER_SERVICE_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          VIT_USERNAME: ${{ secrets.VIT_USERNAME }}
          VIT_PASSWORD: ${{ secrets.VIT_PASSWORD }}
          ALERT_CHANNEL: googlechat
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          DEADLINE_WARN_HOURS: 24

