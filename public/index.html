<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Campus Copilot Chat</title>
  <style>
    body {
      font-family: "Inter", system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1e293b;
      padding: 1rem;
      text-align: center;
      border-bottom: 1px solid #334155;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    
    #alerts {
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }
    .alert-banner {
      background: rgba(239, 68, 68, 0.2);
      border-left: 4px solid #ef4444;
      padding: 0.75rem;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    #login-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
    }
    .login-card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      width: 300px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    input {
      width: 100%;
      padding: 0.75rem;
      margin-top: 0.5rem;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #0f172a;
      color: white;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      margin-top: 1rem;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    
    #chat-container {
      display: none;
      flex-direction: column;
      flex: 1;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      height: 100%;
    }
    #chat-history {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .msg {
      max-width: 80%;
      padding: 1rem;
      border-radius: 8px;
      line-height: 1.5;
    }
    .msg.bot { background: #1e293b; align-self: flex-start; }
    .msg.user { background: #3b82f6; align-self: flex-end; }
    .msg h1, .msg h2, .msg h3 { margin-top: 0; }
    
    #chat-input-area {
      display: flex;
      padding: 1rem;
      background: #1e293b;
      border-top: 1px solid #334155;
    }
    #chat-input-area input { margin-top: 0; flex: 1; border-radius: 6px 0 0 6px; }
    #chat-input-area button { width: auto; margin-top: 0; border-radius: 0 6px 6px 0; }
    
    .spinner { color: #94a3b8; font-style: italic; text-align: center; margin-top: 1rem; }
  </style>
</head>
<body>
  <header>
    <h1>Campus Copilot</h1>
  </header>

  <div id="alerts"></div>

  <div id="login-container">
    <div class="login-card">
      <h2 style="margin-top:0; text-align:center;">LMS Login</h2>
      <input type="text" id="username" placeholder="Username" />
      <input type="password" id="password" placeholder="Password" />
      <button id="loginBtn">Connect LMS</button>
      <div id="loginLoading" class="spinner" style="display:none;">Scraping LMS & preparing context...</div>
      <div id="loginError" style="color:#ef4444; margin-top:1rem; text-align:center;"></div>
    </div>
  </div>

  <div id="chat-container">
    <div id="chat-history"></div>
    <div id="chat-input-area">
      <input type="text" id="chatInput" placeholder="Ask about your assignments..." />
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const loginBtn = document.getElementById('loginBtn');
    const sendBtn = document.getElementById('sendBtn');
    const chatInput = document.getElementById('chatInput');
    const historyEl = document.getElementById('chat-history');
    const alertsEl = document.getElementById('alerts');

    // Fetch alerts on load
    async function loadAlerts() {
      try {
        const res = await fetch('/reminders');
        const data = await res.json();
        if (data.success && data.alerts.length > 0) {
          alertsEl.innerHTML = data.alerts.map(a => `<div class="alert-banner">${a.message} <br><small>${new Date(a.timestamp).toLocaleString()}</small></div>`).join('');
        }
      } catch (e) {
        console.error("Failed to load alerts", e);
      }
    }
    loadAlerts();

    // Handle Login
    loginBtn.addEventListener('click', async () => {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      if (!u || !p) return;

      document.getElementById('loginLoading').style.display = 'block';
      loginBtn.disabled = true;

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username: u, password: p})
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('login-container').style.display = 'none';
          document.getElementById('chat-container').style.display = 'flex';
          addMessage(data.digest, 'bot');
          loadAlerts(); // reload alerts in case new ones were generated
        } else {
          document.getElementById('loginError').innerText = data.error;
        }
      } catch (e) {
        document.getElementById('loginError').innerText = e.message;
      } finally {
        document.getElementById('loginLoading').style.display = 'none';
        loginBtn.disabled = false;
      }
    });

    // Handle Chat
    async function sendMessage() {
      const msg = chatInput.value.trim();
      if (!msg) return;
      
      addMessage(msg, 'user');
      chatInput.value = '';
      sendBtn.disabled = true;

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message: msg})
        });
        const data = await res.json();
        if (data.success) {
          addMessage(data.reply, 'bot');
        } else {
          addMessage(`<span style="color:red">Error: ${data.error}</span>`, 'bot');
        }
      } catch (e) {
        addMessage(`<span style="color:red">Error: ${e.message}</span>`, 'bot');
      } finally {
        sendBtn.disabled = false;
        chatInput.focus();
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    function addMessage(html, sender) {
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.innerHTML = html;
      historyEl.appendChild(div);
      historyEl.scrollTop = historyEl.scrollHeight;
    }
  </script>
</body>
</html>
